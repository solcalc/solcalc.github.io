<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mason McElroy — Game Design Portfolio</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-links">
                <button class="nav-btn" onclick="openAbout()">About</button>
                <a href="https://www.linkedin.com/in/mason-mcelroy/" target="_blank" rel="noopener noreferrer" class="nav-btn">LinkedIn ↗</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-label">Prototype Portfolio</div>
        <h1 class="hero-name">Mason<br>McElroy</h1>
        <div class="hero-rule"></div>
        <p class="hero-tagline">Casino game designer and mathematician. I design the mechanics, build the math model, and occasionally build prototypes.</p>

    </header>

    <main>
        <div class="games-container">
            <div class="games-header">
                <span class="games-label">Prototype Collection</span>
                <span class="games-count">11 games</span>
            </div>
            <section id="games">
                <!-- Game cards loaded dynamically -->
            </section>
        </div>
    </main>

    <!-- Game Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeGame()">&times;</span>
            <div id="gameContainer"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Solcalc Consulting Inc. All rights reserved.</p>
    </footer>

    <script>
        // Game embed codes
        const games = {
            'lucky-pharoah': '<iframe frameborder="0" src="https://itch.io/embed-upload/17804444?color=333333" allowfullscreen allow="autoplay; fullscreen; payment; pointer-lock" width="470" height="772"><a href="https://solcalc.itch.io/lucky-pharoahs-3x3-cluster-collect">Play Lucky Pharoah\'s 3x3 Cluster Collect on itch.io</a></iframe>',

            'triple-rocket-pots': '<iframe frameborder="0" src="https://itch.io/embed-upload/17805863?color=333333" allowfullscreen allow="autoplay; fullscreen; payment; pointer-lock" width="470" height="772"><a href="https://solcalc.itch.io/triple-rocket-pots">Play Triple Rocket Pots on itch.io</a></iframe>',

            'triple-emperor-pots': '<iframe frameborder="0" src="https://itch.io/embed-upload/17807674?color=333333" allowfullscreen="" width="470" height="772"><a href="https://solcalc.itch.io/triple-emperor-pots">Play Triple Emperor Pots on itch.io</a></iframe>',

            'triple-mummy-money-pots': '<iframe frameborder="0" src="https://itch.io/embed-upload/17807553?color=333333" allowfullscreen="" width="470" height="772"><a href="https://solcalc.itch.io/triple-mummy-money-pots">Play Triple Mummy Money Pots on itch.io</a></iframe>',

            'field-goal-kicker': '<iframe frameborder="0" src="https://itch.io/embed-upload/17810082?color=333333" allowfullscreen="" width="800" height="620"><a href="https://solcalc.itch.io/field-goal-kicker">Play Field Goal Kicker on itch.io</a></iframe>',

            'slugfest': '<iframe frameborder="0" src="https://itch.io/embed-upload/17809973?color=333333" allowfullscreen="" width="400" height="820"><a href="https://solcalc.itch.io/slugfest">Play Slugfest on itch.io</a></iframe>',

            'multiplayer-video-poker': '<iframe frameborder="0" src="https://itch.io/embed-upload/17810012?color=333333" allowfullscreen="" width="1300" height="800"><a href="https://solcalc.itch.io/multiplier-video-poker">Play Multiplier Video Poker on itch.io</a></iframe>',

            'magic-card-blackjack': '<iframe frameborder="0" src="https://itch.io/embed-upload/17817320?color=333333" allowfullscreen="" width="1250" height="1020"><a href="https://solcalc.itch.io/magic-card-blackjack">Play Magic Card Blackjack on itch.io</a></iframe>',

            'magikarp-escape': '<iframe frameborder="0" src="https://itch.io/embed-upload/17817418?color=333333" allowfullscreen="" width="500" height="1020"><a href="https://solcalc.itch.io/magikarp-escape">Play Magikarp Escape on itch.io</a></iframe>',

            'anubis': '<iframe frameborder="0" src="https://itch.io/embed-upload/17817450?color=333333" allowfullscreen="" width="400" height="820"><a href="https://solcalc.itch.io/anubis">Play Anubis on itch.io</a></iframe>',

            '3x-pot-casino-frenzy': '<iframe frameborder="0" src="https://itch.io/embed-upload/17942993?color=333333" allowfullscreen="" width="470" height="772"><a href="https://solcalc.itch.io/3x-pot-casino-frenzy">Play 3x-pot-casino-frenzy on itch.io</a></iframe>',
            // Add more game embeds here with unique IDs
        };

        // List of game card HTML files to load
        const gameCards = [
            'games/3x-pot-casino-frenzy.html',
            'games/lucky-pharoah.html',
            'games/triple-mummy-money-pots.html',
            'games/triple-emperor-pots.html',
            'games/triple-rocket-pots.html',
            'games/field-goal-kicker.html',
            'games/slugfest.html',
            'games/multiplayer-video-poker.html',
            'games/magic-card-blackjack.html',
            'games/magikarp-escape.html',
            'games/anubis.html',

            // Add more game card files here
        ];

        // Load game cards from HTML files
        async function loadGameCards() {
            const gamesSection = document.getElementById('games');
            
            for (const cardFile of gameCards) {
                try {
                    const response = await fetch(cardFile);
                    if (response.ok) {
                        const html = await response.text();
                        gamesSection.innerHTML += html;
                    } else {
                        console.error(`Failed to load ${cardFile}: ${response.status}`);
                    }
                } catch (error) {
                    console.error(`Failed to load ${cardFile}:`, error);
                }
            }
        }

        // Load cards when page loads
        document.addEventListener('DOMContentLoaded', loadGameCards);

        function scaleGameIframe() {
            const wrapper = document.querySelector('.game-iframe-wrapper');
            const iframe = wrapper && wrapper.querySelector('iframe');
            if (!wrapper || !iframe) return;

            const nativeWidth = parseInt(iframe.getAttribute('width'), 10);
            const nativeHeight = parseInt(iframe.getAttribute('height'), 10);
            if (!nativeWidth || !nativeHeight) return;

            // modal-content has 20px padding on each side
            const modalPadding = 40;
            const availableWidth = window.innerWidth * 0.95 - modalPadding;
            const availableHeight = window.innerHeight * 0.92;

            const scaleByWidth = availableWidth / nativeWidth;
            const scaleByHeight = availableHeight / nativeHeight;
            const scale = Math.min(scaleByWidth, scaleByHeight, 1); // never scale up

            if (scale < 1) {
                iframe.style.transformOrigin = 'top left';
                iframe.style.transform = 'scale(' + scale + ')';
                wrapper.style.width = (nativeWidth * scale) + 'px';
                wrapper.style.height = (nativeHeight * scale) + 'px';
                wrapper.style.overflow = 'hidden';
            } else {
                iframe.style.transform = '';
                iframe.style.transformOrigin = '';
                wrapper.style.width = '';
                wrapper.style.height = '';
                wrapper.style.overflow = '';
            }
        }

        function openGame(gameId) {
            const modal = document.getElementById('gameModal');
            const container = document.getElementById('gameContainer');
            
            if (games[gameId]) {
                // Add loading indicator
                container.innerHTML = '<div style="text-align: center; padding: 50px; color: #fff;"><div style="font-size: 24px; margin-bottom: 20px;">Loading game...</div><div style="font-size: 14px; color: #888;">This may take a moment</div></div>';
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
                
                // Load iframe after a brief delay to show loading state
                setTimeout(() => {
                    container.innerHTML = '<div class="game-iframe-wrapper">' + games[gameId] + '</div>';
                    scaleGameIframe();
                }, 100);
            }
        }

        function closeGame() {
            const modal = document.getElementById('gameModal');
            const container = document.getElementById('gameContainer');
            
            modal.style.display = 'none';
            container.innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function openAbout() {
            const modal = document.getElementById('gameModal');
            const container = document.getElementById('gameContainer');
            
            container.innerHTML = '<iframe src="about.html" style="width: 900px; max-width: 95vw; height: 90vh; border: none; border-radius: 8px;"></iframe>';
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // Close when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('gameModal');
            if (event.target === modal) {
                closeGame();
            }
        }

        // Close with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeGame();
            }
        });

        // Re-scale on orientation change / resize
        window.addEventListener('resize', scaleGameIframe);
    </script>
</body>
</html>
