<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Embed</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            font-family: sans-serif;
        }
        .test-container {
            margin: 20px auto;
            max-width: 500px;
        }
        h1 { color: #4ade80; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Direct Embed Test - Triple Rocket Pots</h1>
        <p>Testing the itch.io embed code directly without modal:</p>
        
        <iframe frameborder="0" src="https://itch.io/embed-upload/17805863?color=333333" allowfullscreen="" width="470" height="772">
            <a href="https://solcalc.itch.io/triple-rocket-pots">Play Triple Rocket Pots on itch.io</a>
        </iframe>
        
        <h1 style="margin-top: 40px;">Modal Test - Triple Rocket Pots</h1>
        <button onclick="openModal()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
            Open in Modal
        </button>
        
        <div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000;">
            <div style="position: relative; margin: 3% auto; width: fit-content;">
                <button onclick="closeModal()" style="position: absolute; top: -15px; right: -15px; width: 45px; height: 45px; border-radius: 50%; background: #000; color: white; border: 2px solid #333; font-size: 24px; cursor: pointer;">×</button>
                <div id="modalContent"></div>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.innerHTML = '<iframe frameborder="0" src="https://itch.io/embed-upload/17805863?color=333333" allowfullscreen="" width="470" height="772"><a href="https://solcalc.itch.io/triple-rocket-pots">Play Triple Rocket Pots on itch.io</a></iframe>';
            modal.style.display = 'block';
        }
        
        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            modal.style.display = 'none';
            content.innerHTML = '';
        }
        
        // Log iframe loading events
        document.addEventListener('DOMContentLoaded', () => {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach((iframe, index) => {
                iframe.addEventListener('load', () => {
                    console.log(`Iframe ${index} loaded successfully`);
                });
                iframe.addEventListener('error', (e) => {
                    console.error(`Iframe ${index} error:`, e);
                });
            });
        });
    </script>
</body>
</html>
