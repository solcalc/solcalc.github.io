<article class="game-card">
    <div class="game-thumbnail">
        <img src="img/anubis.jpeg" alt="Anubis Game Thumbnail">
    </div>
    <div class="game-info">
        <h2 class="game-title">Anubis</h2>
        <p class="game-date">October 2022</p>
        <p class="game-description">
            One of the first prototypes I developed. Developed as a competitive response to the Lucky Tap games.
        </p>
        <ul class="game-features">
            <li>Tap the jar and win a prize. Simple!</li>
            <li>Multipliers stick for 5 wagers.</li>
            <li>3 possible jackpots. Grand is worth 25,000x!</li>
        </ul>
        <div class="game-links">
            <button class="btn btn-primary" onclick="openGame('anubis')">Play Game</button>
        </div>
    </div>
</article>
